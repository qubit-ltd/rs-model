[package]
name = "qubit-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-model"
description = "Migrated domain objects for the Qubit Rust platform"
homepage = "https://github.com/qubit-ltd/rs-model"
documentation = "https://docs.rs/qubit-model"
readme = "README.md"
keywords = ["domain-model", "model", "qubit", "rust"]
categories = ["data-structures"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_model"
doctest = true

[dependencies]
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
qubit-mixin = { path = "../rs-mixin" }
qubit-model-derive = { path = "../rs-model-derive" }
qubit-model-metadata = { path = "../rs-model-metadata", features = ["big-decimal", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
